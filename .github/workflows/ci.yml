name: CI Pipeline

on:
  push:
    branches: [ "**" ]
    # A vX.Y.Z tag publishes image X.Y.Z, which the platform rolls out. With a
    # staging environment, vX.Y.Z-rc.N goes to staging and the CMP promotes it.
    tags: [ "v*.*.*" ]
    paths-ignore:
      - "deploy/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "deploy/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Check required files
        run: |
          test -f index.html
          test -f styles/style.css
          test -f Dockerfile
          test -f README.md

  docker-build:
    runs-on: ubuntu-latest
    needs: static-check 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a released version
        # A version is built once: staging runs it, then the CMP promotes that
        # exact image to prod. Rebuilding under the same tag would put an
        # image nobody tested behind a name that was.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_REF_NAME#v}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image already exists. Push a new tag (the next -rc.N) instead of moving this one."
            exit 1
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # Merged by the workflow once the image builds: GitHub auto-merge would need a
  # repo setting and branch protection that generated repos do not have.
  dependabot-merge:
    runs-on: ubuntu-latest
    needs: [static-check, docker-build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      - name: Merge patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
